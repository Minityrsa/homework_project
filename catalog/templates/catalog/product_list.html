<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интернет-магазин</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .product { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .product h3 { margin: 0 0 8px; color: #2c3e50; }
        .price { color: #e74c3c; font-weight: bold; font-size: 18px; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>🛒 Наши товары</h1>

    {% if products %}
        {% for product in products %}
            <div class="product">
                <h3>{{ product.name }}</h3>
                {% if product.description %}
                    <p>{{ product.description }}</p>
                {% endif %}
                <p class="price">{{ product.price }} ₽</p>
            </div>
        {% endfor %}
    {% else %}
        <p class="empty">Пока товаров нет. Добавьте их через админку.</p>
    {% endif %}
</body>
</html>
