<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интернет-магазин</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { color: #333; margin: 0; }
        .btn-add {
            background: #27ae60; color: white; text-decoration: none;
            padding: 10px 20px; border-radius: 6px; font-size: 15px;
        }
        .btn-add:hover { background: #229954; }
        .product { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .product h3 { margin: 0 0 8px; color: #2c3e50; }
        .price { color: #e74c3c; font-weight: bold; font-size: 18px; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 Наши товары</h1>
        <a href="{% url 'product_add' %}" class="btn-add">➕ Добавить товар</a>
    </div>

    {% if products %}
        {% for product in products %}
            <div class="product">
                <h3>{{ product.name }}</h3>
                {% if product.description %}
                    <p>{{ product.description }}</p>
                {% endif %}
                <p class="price">{{ product.price }} ₽</p>
            </div>
        {% endfor %}
    {% else %}
        <p class="empty">Пока товаров нет. Нажмите «Добавить товар», чтобы создать первый.</p>
    {% endif %}
</body>
</html>
