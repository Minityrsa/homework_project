<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #2c3e50; }
        .form-input, input[type="text"], input[type="password"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        .error-summary {
            background: #fdecea; color: #c0392b; padding: 12px 16px;
            border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #e74c3c;
        }
        button {
            width: 100%; background: #3498db; color: white; border: none;
            padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px;
            margin-top: 8px;
        }
        button:hover { background: #2980b9; }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🔑 Вход</h1>

    {% if form.errors %}
        <div class="error-summary">Неверное имя пользователя или пароль.</div>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Имя пользователя</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Пароль</label>
            {{ form.password }}
        </div>
        <button type="submit">Войти</button>
    </form>

    <div class="links">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </div>
</body>
</html>
