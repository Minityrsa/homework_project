<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #2c3e50; }
        .form-input, input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        .errorlist {
            list-style: none; padding: 8px 12px; margin: 6px 0 0;
            background: #fdecea; color: #c0392b; border-radius: 6px;
            font-size: 13px; border-left: 4px solid #e74c3c;
        }
        .helptext { color: #888; font-size: 12px; display: block; margin-top: 4px; }
        button {
            width: 100%; background: #27ae60; color: white; border: none;
            padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px;
            margin-top: 8px;
        }
        button:hover { background: #229954; }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <h1>📝 Регистрация</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                    </ul>
                {% endif %}
                {% if field.help_text %}
                    <small class="helptext">{{ field.help_text|safe }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="links">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </div>
</body>
</html>
